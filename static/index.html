<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperMate — 论文知识库</title>
<!-- 样式 -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5; height: 100vh; display: flex; flex-direction: column;
}
/* 顶栏 */
header {
  background: linear-gradient(135deg, #4a90d9, #6c5ce7);
  color: #fff; padding: 14px 24px; display: flex; align-items: center;
  justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
header h1 { font-size: 18px; font-weight: 600; }
header .status { font-size: 12px; opacity: .9; }
/* 上传按钮 */
.upload-btn {
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4);
  color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer;
  font-size: 13px; transition: all .2s;
}
.upload-btn:hover { background: rgba(255,255,255,.35); }
/* 聊天区 */
#chat {
  flex: 1; overflow-y: auto; padding: 20px; display: flex;
  flex-direction: column; gap: 14px;
}
.msg { max-width: 78%; padding: 12px 16px; border-radius: 12px;
  line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: #4a90d9; color: #fff;
  border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: #fff; color: #333;
  border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.msg.system { align-self: center; background: #e8f5e9; color: #2e7d32;
  font-size: 13px; padding: 6px 14px; }
/* 输入区 */
#input-bar {
  background: #fff; padding: 14px 20px; border-top: 1px solid #e0e0e0;
  display: flex; gap: 10px; align-items: center;
}
#input {
  flex: 1; border: 1px solid #d0d0d0; border-radius: 8px; padding: 10px 14px;
  font-size: 14px; outline: none; transition: border .2s;
}
#input:focus { border-color: #4a90d9; }
#send-btn {
  background: #4a90d9; color: #fff; border: none; border-radius: 8px;
  padding: 10px 22px; font-size: 14px; cursor: pointer; transition: all .2s;
}
#send-btn:hover { background: #3a7bc8; }
#send-btn:disabled { background: #b0bec5; cursor: not-allowed; }
/* 打字指示 */
.typing { display: flex; gap: 4px; padding: 4px 2px; }
.typing span { width: 6px; height: 6px; background: #90a4ae; border-radius: 50%;
  animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
</style>
</head>
<body>

<header>
  <h1>📚 PaperMate 论文知识库</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="status" id="status">连接中...</span>
    <label class="upload-btn">📄 上传论文
      <input type="file" id="pdfInput" accept=".pdf" hidden>
    </label>
  </div>
</header>

<div id="chat">
  <div class="msg system">👋 你好！我是论文知识库助手。可以直接提问，也可以上传 PDF 论文让我分析。</div>
</div>

<div id="input-bar">
  <input id="input" placeholder="输入问题，或说'把xxx加进知识库'..." autofocus>
  <button id="send-btn">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const pdfInput = document.getElementById('pdfInput');
const statusEl = document.getElementById('status');

// ---- 消息渲染 ----
function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;   // 纯文本渲染，避免 XSS
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// ---- 发送消息 ----
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  const typing = showTyping();
  sendBtn.disabled = true;
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    typing.remove();
    addMsg(data.reply || '（无回复）', 'bot');
  } catch (e) {
    typing.remove();
    addMsg('⚠️ 网络错误: ' + e.message, 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
}

// ---- 上传 ----
pdfInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const typing = showTyping();
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();
    typing.remove();
    addMsg(`✅ 已上传《${data.filename}》。可以问我这篇论文的内容，或说"把这篇论文加进知识库"。`, 'system');
  } catch (err) {
    typing.remove();
    addMsg('⚠️ 上传失败: ' + err.message, 'bot');
  }
  e.target.value = '';
});

// ---- 状态 ----
async function loadStatus() {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    statusEl.textContent = `${data.total_papers || 0} 篇论文 · ${data.total_chunks || 0} 片段`;
  } catch (e) {
    statusEl.textContent = '离线';
  }
}

// ---- 事件绑定 ----
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
loadStatus();
setInterval(loadStatus, 15000);
input.focus();
</script>
</body>
</html>

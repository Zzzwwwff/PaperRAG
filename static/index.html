<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperMate — 论文知识库</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- 样式 -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5; height: 100vh; display: flex; flex-direction: column;
}
/* 顶栏 */
header {
  background: linear-gradient(135deg, #4a90d9, #6c5ce7);
  color: #fff; padding: 14px 24px; display: flex; align-items: center;
  justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
header h1 { font-size: 18px; font-weight: 600; }
header .status { font-size: 12px; opacity: .9; }
/* 上传按钮 */
.upload-btn {
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4);
  color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer;
  font-size: 13px; transition: all .2s;
}
.upload-btn:hover { background: rgba(255,255,255,.35); }
/* 聊天区 */
#chat {
  flex: 1; overflow-y: auto; padding: 20px; display: flex;
  flex-direction: column; gap: 14px;
}
.msg { max-width: 78%; padding: 12px 16px; border-radius: 12px;
  line-height: 1.7; font-size: 14px; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: #4a90d9; color: #fff;
  border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: #4a90d9; color: #fff;
  border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: #fff; color: #333;
  border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
/* Markdown 渲染样式 */
.msg.bot h2,.msg.bot h3,.msg.bot h4 { margin: 10px 0 6px; color: #1a1a2e; }
.msg.bot table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
.msg.bot th { background: #eef2f7; font-weight: 600; }
.msg.bot th,.msg.bot td { border: 1px solid #d0d5dd; padding: 6px 10px; text-align: left; }
.msg.bot code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px;
  font-family: "SF Mono", "Fira Code", monospace; font-size: 13px; }
.msg.bot pre { background: #1e1e2e; color: #cdd6f4; padding: 10px 14px;
  border-radius: 8px; overflow-x: auto; margin: 8px 0; }
.msg.bot pre code { background: none; padding: 0; color: inherit; }
.msg.bot hr { border: none; border-top: 1px solid #e0e0e0; margin: 10px 0; }
.msg.bot li { margin-left: 18px; }
.msg.bot p { margin: 4px 0; }
.msg.system { align-self: center; background: #e8f5e9; color: #2e7d32;
  font-size: 13px; padding: 6px 14px; }
/* 输入区 */
#input-bar {
  background: #fff; padding: 14px 20px; border-top: 1px solid #e0e0e0;
  display: flex; gap: 10px; align-items: center;
}
#input {
  flex: 1; border: 1px solid #d0d0d0; border-radius: 8px; padding: 10px 14px;
  font-size: 14px; outline: none; transition: border .2s;
}
#input:focus { border-color: #4a90d9; }
#send-btn {
  background: #4a90d9; color: #fff; border: none; border-radius: 8px;
  padding: 10px 22px; font-size: 14px; cursor: pointer; transition: all .2s;
}
#send-btn:hover { background: #3a7bc8; }
#send-btn:disabled { background: #b0bec5; cursor: not-allowed; }
/* 打字指示 */
.typing { display: flex; gap: 4px; padding: 4px 2px; }
.typing span { width: 6px; height: 6px; background: #90a4ae; border-radius: 50%;
  animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
</style>
</head>
<body>

<header>
  <h1>📚 PaperMate 论文知识库</h1>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="status" id="status">连接中...</span>
    <label class="upload-btn">📄 上传论文
      <input type="file" id="pdfInput" accept=".pdf" hidden>
    </label>
  </div>
</header>

<div id="chat">
  <div class="msg system">👋 你好！我是论文知识库助手。可以直接提问，也可以上传 PDF 论文让我分析。</div>
</div>

<div id="input-bar">
  <input id="input" placeholder="输入问题..." autofocus>
  <button id="send-btn">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const pdfInput = document.getElementById('pdfInput');
const statusEl = document.getElementById('status');

// ---- 消息渲染 ----
function renderMath(el) {
  renderMathInElement(el, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
    ],
    throwOnError: false,
  });
}

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (type === 'bot') {
    div.innerHTML = marked.parse(text);
    renderMath(div);
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// ---- 发送消息（SSE 流式） ----
let sending = false;  // 防并发

async function send() {
  if (sending) return;       // 正在处理中，忽略
  const text = input.value.trim();
  if (!text) return;
  sending = true;
  input.value = '';
  addMsg(text, 'user');
  sendBtn.disabled = true;

  // 占位：工具状态行 + 回答内容
  const toolLine = document.createElement('div');
  toolLine.className = 'msg system';
  toolLine.style.display = 'none';
  chat.appendChild(toolLine);

  const botDiv = document.createElement('div');
  botDiv.className = 'msg bot';
  // typing 指示器
  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  botDiv.appendChild(typingEl);
  chat.appendChild(botDiv);
  chat.scrollTop = chat.scrollHeight;

  let fullAnswer = '';

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // 解析 SSE 事件
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';  // 最后一行可能不完整

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6);
        if (!jsonStr) continue;
        try {
          const evt = JSON.parse(jsonStr);
          if (evt.type === 'token') {
            if (typingEl.parentNode) typingEl.remove();
            fullAnswer += evt.content;
            botDiv.innerHTML = marked.parse(fullAnswer);
            renderMath(botDiv);
            chat.scrollTop = chat.scrollHeight;
          } else if (evt.type === 'tool') {
            if (typingEl.parentNode) typingEl.remove();
            const icon = evt.success ? '✅' : '⚠️';
            toolLine.style.display = 'block';
            toolLine.textContent = `${icon} 调用工具: ${evt.name}`;
          } else if (evt.type === 'done') {
            // 流结束
          }
        } catch (_) { /* 忽略 JSON 解析错误 */ }
      }
    }
  } catch (e) {
    if (typingEl.parentNode) typingEl.remove();
    botDiv.textContent = '⚠️ 网络错误: ' + e.message;
  }

  if (typingEl.parentNode) typingEl.remove();
  if (!fullAnswer) botDiv.textContent = '（无回复）';
  sendBtn.disabled = false;
  sending = false;
  input.focus();
}

// ---- 上传 ----
pdfInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  addMsg(`📤 正在上传并解析 ${file.name}...`, 'system');
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (data.parse && data.parse.title) {
      addMsg(`✅ 已解析《${data.parse.title}》\n   作者: ${data.parse.authors || '未知'} | ${data.parse.chunks} 个段落\n   💡 可以问: "这篇论文作者是谁"`, 'system');
    } else {
      addMsg(`⚠️ 上传成功但解析失败: ${data.parse?.error || '未知错误'}`, 'system');
    }
  } catch (err) {
    addMsg('⚠️ 上传失败: ' + err.message, 'bot');
  }
  e.target.value = '';
});

// ---- 状态 ----
async function loadStatus() {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    statusEl.textContent = `${data.total_papers || 0} 篇论文 · ${data.total_chunks || 0} 片段`;
  } catch (e) {
    statusEl.textContent = '离线';
  }
}

// ---- 输入法状态追踪 ----
let imeActive = false;
input.addEventListener('compositionstart', () => { imeActive = true; });
input.addEventListener('compositionend', () => { imeActive = false; });

// ---- 事件绑定 ----
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !imeActive) send();
});
loadStatus();
loadHistory();
setInterval(loadStatus, 15000);
input.focus();

// ---- 恢复对话历史 ----
async function loadHistory() {
  try {
    const res = await fetch('/history');
    const data = await res.json();
    for (const m of (data.messages || [])) {
      addMsg(m.content, m.role === 'user' ? 'user' : 'bot');
    }
  } catch (_) { /* 忽略 */ }
}
</script>
</body>
</html>
